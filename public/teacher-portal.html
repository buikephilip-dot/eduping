<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EduPing Teacher Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #1a56db; --brand-dark: #1e429f; --success: #057a55; --danger: #e02424;
    --warn: #d97706; --bg: #f3f4f6; --card: #ffffff; --border: #e5e7eb;
    --text: #111827; --muted: #6b7280; --radius: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.5; padding-bottom: 40px; }
  #header { background: var(--brand); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #header-title { font-size: 16px; font-weight: 700; }
  #header-sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .center { text-align: center; }
  h2 { font-size: 18px; margin-bottom: 8px; }
  p.muted { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { resize: vertical; min-height: 70px; }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 18px; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
  .ok { color: var(--success); font-size: 13px; margin-top: 10px; display: none; }
  .pin-input { text-align: center; font-size: 28px; letter-spacing: 10px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
  .tab-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .opt-row input[type=text] { flex: 1; }
  .opt-row input[type=radio], .opt-row input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; }
  .add-opt-btn { background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 8px; width: 100%; margin-top: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .submission { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .submission:last-child { border-bottom: none; }
  .pill { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; margin-left: 8px; }
  .pill-pending { background: #fef3c7; color: #92400e; }
  .pill-approved { background: #d1fae5; color: #065f46; }
  .pill-rejected { background: #fee2e2; color: #991b1b; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="header">
  <div id="header-title">📋 EduPing Teacher Portal</div>
  <div id="header-sub">Loading…</div>
</div>

<div class="wrap">
  <div id="loading" class="spinner"></div>

  <div id="error-view" class="card center hidden">
    <h2>⚠️ Link unavailable</h2>
    <p class="muted" id="error-text">This link is invalid or has expired.</p>
  </div>

  <div id="pin-view" class="card hidden">
    <h2 class="center">🔐 Enter your PIN</h2>
    <p class="muted center">Check WhatsApp for the 4-digit PIN sent right after your link.</p>
    <input type="text" id="pin-input" class="pin-input" inputmode="numeric" maxlength="4" placeholder="0000">
    <button class="btn btn-primary" id="unlock-btn" onclick="unlock()">Unlock</button>
    <div class="err" id="pin-err"></div>
  </div>

  <div id="main-view" class="hidden">
    <div class="card">
      <h2 id="welcome-text"></h2>
      <p class="muted" id="welcome-sub"></p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-q-btn" onclick="switchTab('question')">➕ Add Question</button>
      <button class="tab-btn" id="tab-s-btn" onclick="switchTab('score')">📊 Submit Score</button>
    </div>

    <div class="tab-panel active" id="tab-question">
      <div class="card">
        <label>Assessment</label>
        <select id="q-assessment"></select>

        <label>Question text</label>
        <textarea id="q-text" placeholder="e.g. What is the capital of Nigeria?"></textarea>

        <label>Type</label>
        <select id="q-type" onchange="renderOptions()">
          <option value="mcq">Multiple choice</option>
          <option value="truefalse">True / False</option>
          <option value="fillin">Fill in the blank</option>
        </select>

        <label>Marks</label>
        <input type="number" id="q-marks" value="1" min="1">

        <div id="q-options-wrap"></div>

        <button class="btn btn-primary" id="q-submit-btn" onclick="submitQuestion()">Submit for review</button>
        <div class="err" id="q-err"></div>
        <div class="ok" id="q-ok"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-score">
      <div class="card">
        <label>Student name</label>
        <input type="text" id="s-name" placeholder="e.g. Chidinma Okeke">

        <label>Subject</label>
        <input type="text" id="s-subject" placeholder="e.g. Mathematics">

        <label>Score (out of 100)</label>
        <input type="number" id="s-score" min="0" max="100">

        <label>Term</label>
        <input type="text" id="s-term" placeholder="e.g. First Term 2026">

        <button class="btn btn-primary" id="s-submit-btn" onclick="submitScore()">Submit for review</button>
        <div class="err" id="s-err"></div>
        <div class="ok" id="s-ok"></div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:15px">Recent submissions</h2>
      <div id="recent-list"></div>
    </div>
  </div>
</div>

<script>
const token = location.pathname.split('/').pop();
let portalData = null;

function getDeviceId() {
  let id = localStorage.getItem('eduping-device-id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('eduping-device-id', id);
  }
  return id;
}

async function api(path, opts = {}) {
  const res = await fetch(`/api/teacher/${token}${path}`, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'x-device-id': getDeviceId() },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

async function load() {
  try {
    portalData = await api('');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('header-sub').textContent = portalData.school_name || '';
    if (portalData.unlocked) {
      showMain();
    } else {
      document.getElementById('pin-view').classList.remove('hidden');
    }
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-text').textContent = e.message;
    document.getElementById('error-view').classList.remove('hidden');
  }
}

async function unlock() {
  const pin = document.getElementById('pin-input').value.trim();
  const errEl = document.getElementById('pin-err');
  errEl.style.display = 'none';
  if (pin.length !== 4) { errEl.textContent = 'Enter the 4-digit PIN.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('unlock-btn');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    await api('/unlock', { method: 'POST', body: { pin, device_id: getDeviceId() } });
    document.getElementById('pin-view').classList.add('hidden');
    portalData = await api('');
    showMain();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function showMain() {
  document.getElementById('main-view').classList.remove('hidden');
  document.getElementById('welcome-text').textContent = `Hi ${portalData.staff_name} 👋`;
  document.getElementById('welcome-sub').textContent = `${portalData.class_name || ''} ${portalData.subject ? '· ' + portalData.subject : ''}`;
  document.getElementById('s-subject').value = portalData.subject || '';

  const sel = document.getElementById('q-assessment');
  sel.innerHTML = portalData.assessments.length
    ? portalData.assessments.map(a => `<option value="${a.id}">${a.title} (${a.subject})</option>`).join('')
    : '<option value="">No open assessments for your class yet</option>';

  renderOptions();
  renderRecent();
}

function renderOptions() {
  const type = document.getElementById('q-type').value;
  const wrap = document.getElementById('q-options-wrap');
  if (type === 'fillin') { wrap.innerHTML = '<label>Correct answer</label><input type="text" id="fillin-answer" placeholder="Expected answer">'; return; }
  if (type === 'truefalse') {
    wrap.innerHTML = `
      <label>Correct answer</label>
      <div class="opt-row"><input type="radio" name="tf" value="true" checked><span>True</span></div>
      <div class="opt-row"><input type="radio" name="tf" value="false"><span>False</span></div>`;
    return;
  }
  wrap.innerHTML = `<label>Options (mark the correct one)</label><div id="mcq-opts"></div><button type="button" class="add-opt-btn" onclick="addOption()">+ Add option</button>`;
  addOption(); addOption();
}

function addOption() {
  const wrap = document.getElementById('mcq-opts');
  const row = document.createElement('div');
  row.className = 'opt-row';
  row.innerHTML = `<input type="radio" name="mcq-correct"><input type="text" placeholder="Option text">`;
  wrap.appendChild(row);
}

async function submitQuestion() {
  const errEl = document.getElementById('q-err'), okEl = document.getElementById('q-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  const assessment_id = document.getElementById('q-assessment').value;
  const question_text = document.getElementById('q-text').value.trim();
  const question_type = document.getElementById('q-type').value;
  const marks = parseInt(document.getElementById('q-marks').value, 10) || 1;

  if (!assessment_id) { errEl.textContent = 'Select an assessment.'; errEl.style.display = 'block'; return; }
  if (!question_text) { errEl.textContent = 'Enter the question text.'; errEl.style.display = 'block'; return; }

  let options = [];
  if (question_type === 'mcq') {
    const rows = document.querySelectorAll('#mcq-opts .opt-row');
    rows.forEach(r => {
      const radio = r.querySelector('input[type=radio]'); const text = r.querySelector('input[type=text]').value.trim();
      if (text) options.push({ text, is_correct: radio.checked });
    });
    if (options.length < 2) { errEl.textContent = 'Add at least 2 options.'; errEl.style.display = 'block'; return; }
    if (!options.some(o => o.is_correct)) { errEl.textContent = 'Mark the correct option.'; errEl.style.display = 'block'; return; }
  } else if (question_type === 'truefalse') {
    const val = document.querySelector('input[name=tf]:checked').value;
    options = [{ text: 'True', is_correct: val === 'true' }, { text: 'False', is_correct: val === 'false' }];
  } else {
    const ans = document.getElementById('fillin-answer').value.trim();
    if (!ans) { errEl.textContent = 'Enter the correct answer.'; errEl.style.display = 'block'; return; }
    options = [{ text: ans, is_correct: true }];
  }

  const btn = document.getElementById('q-submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await api('/questions', { method: 'POST', body: { assessment_id, question_text, question_type, marks, options } });
    okEl.textContent = r.message; okEl.style.display = 'block';
    document.getElementById('q-text').value = '';
    renderOptions();
    portalData = await api('');
    renderRecent();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
}

async function submitScore() {
  const errEl = document.getElementById('s-err'), okEl = document.getElementById('s-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  const student_name = document.getElementById('s-name').value.trim();
  const subject = document.getElementById('s-subject').value.trim();
  const score = document.getElementById('s-score').value;
  const term = document.getElementById('s-term').value.trim();

  if (!student_name || !subject || score === '') { errEl.textContent = 'Fill in student, subject, and score.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('s-submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await api('/scores', { method: 'POST', body: { student_name, subject, score: Number(score), term } });
    okEl.textContent = r.message; okEl.style.display = 'block';
    document.getElementById('s-name').value = ''; document.getElementById('s-score').value = '';
    portalData = await api('');
    renderRecent();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
}

function renderRecent() {
  const list = document.getElementById('recent-list');
  const items = portalData.recent_submissions || [];
  list.innerHTML = items.length
    ? items.map(i => `<div class="submission"><span>${i.kind === 'question' ? '❓' : '📊'} ${escapeHtml(i.label)}</span><span class="pill pill-${i.status}">${i.status}</span></div>`).join('')
    : '<p class="muted" style="font-size:13px">No submissions yet.</p>';
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function switchTab(name) {
  document.getElementById('tab-question').classList.toggle('active', name === 'question');
  document.getElementById('tab-score').classList.toggle('active', name === 'score');
  document.getElementById('tab-q-btn').classList.toggle('active', name === 'question');
  document.getElementById('tab-s-btn').classList.toggle('active', name === 'score');
}

load();
</script>
</body>
</html>
