<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EduPing Teacher Portal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #1a56db; --brand-dark: #1e429f; --success: #057a55; --danger: #e02424;
    --warn: #d97706; --bg: #f3f4f6; --card: #ffffff; --border: #e5e7eb;
    --text: #111827; --muted: #6b7280; --radius: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.5; padding-bottom: 40px; }
  #header { background: var(--brand); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #header-title { font-size: 16px; font-weight: 700; }
  #header-sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .center { text-align: center; }
  h2 { font-size: 18px; margin-bottom: 8px; }
  p.muted { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { resize: vertical; min-height: 70px; }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 18px; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
  .ok { color: var(--success); font-size: 13px; margin-top: 10px; display: none; }
  .pin-input { text-align: center; font-size: 28px; letter-spacing: 10px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
  .tab-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .opt-row input[type=text] { flex: 1; }
  .opt-row input[type=radio], .opt-row input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; }
  .add-opt-btn { background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 8px; width: 100%; margin-top: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .submission { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .submission:last-child { border-bottom: none; }
  .pill { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; margin-left: 8px; }
  .pill-pending { background: #fef3c7; color: #92400e; }
  .pill-approved { background: #d1fae5; color: #065f46; }
  .pill-rejected { background: #fee2e2; color: #991b1b; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .student-search-results { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; display: none; }
  .student-search-results.show { display: block; }
  .student-search-item { padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .student-search-item:last-child { border-bottom: none; }
  .student-search-item:hover { background: #f3f4f6; }
  .student-selected { margin-top: 8px; padding: 10px 12px; background: #eff6ff; border-radius: 8px; font-size: 14px; }
  .clear-student-btn { float: right; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; }
  .student-report-card { transition: opacity .15s; }
  .student-report-card.excluded { opacity: .45; }
  .student-report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .student-report-name { font-weight: 700; font-size: 15px; }
  .exclude-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .exclude-toggle input { width: 16px; height: 16px; cursor: pointer; }
  .report-textarea { min-height: 90px; }
  .save-edit-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; margin-top: 10px; }
  .save-status { font-size: 12px; color: var(--success); margin-top: 6px; display: none; }
</style>
</head>
<body>

<div id="header">
  <div id="header-title">📋 EduPing Teacher Portal</div>
  <div id="header-sub">Loading…</div>
</div>

<div class="wrap">
  <div id="loading" class="spinner"></div>

  <div id="error-view" class="card center hidden">
    <h2>⚠️ Link unavailable</h2>
    <p class="muted" id="error-text">This link is invalid or has expired.</p>
  </div>

  <div id="pin-view" class="card hidden">
    <h2 class="center">🔐 Enter your PIN</h2>
    <p class="muted center">Check WhatsApp for the 4-digit PIN sent right after your link.</p>
    <input type="text" id="pin-input" class="pin-input" inputmode="numeric" maxlength="4" placeholder="0000">
    <button class="btn btn-primary" id="unlock-btn" onclick="unlock()">Unlock</button>
    <div class="err" id="pin-err"></div>
  </div>

  <div id="main-view" class="hidden">
    <div class="card">
      <h2 id="welcome-text"></h2>
      <p class="muted" id="welcome-sub"></p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-q-btn" onclick="switchTab('question')">➕ Add Question</button>
      <button class="tab-btn" id="tab-s-btn" onclick="switchTab('score')">📊 Submit Score</button>
      <button class="tab-btn hidden" id="tab-r-btn" onclick="switchTab('report')">📋 Weekly Report</button>
      <button class="tab-btn hidden" id="tab-f-btn" onclick="switchTab('fee')">💰 Fee Payment</button>
    </div>

    <div class="tab-panel active" id="tab-question">
      <div class="card">
        <label>Assessment</label>
        <select id="q-assessment"></select>

        <label>Question text</label>
        <textarea id="q-text" placeholder="e.g. What is the capital of Nigeria?"></textarea>

        <label>Type</label>
        <select id="q-type" onchange="renderOptions()">
          <option value="mcq">Multiple choice</option>
          <option value="truefalse">True / False</option>
          <option value="fillin">Fill in the blank</option>
        </select>

        <label>Marks</label>
        <input type="number" id="q-marks" value="1" min="1">

        <div id="q-options-wrap"></div>

        <button class="btn btn-primary" id="q-submit-btn" onclick="submitQuestion()">Submit for review</button>
        <div class="err" id="q-err"></div>
        <div class="ok" id="q-ok"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-score">
      <div class="card">
        <label>Student name</label>
        <input type="text" id="s-name" placeholder="e.g. Chidinma Okeke">

        <label>Subject</label>
        <input type="text" id="s-subject" placeholder="e.g. Mathematics">

        <label>Score (out of 100)</label>
        <input type="number" id="s-score" min="0" max="100">

        <label>Term</label>
        <input type="text" id="s-term" placeholder="e.g. First Term 2026">

        <button class="btn btn-primary" id="s-submit-btn" onclick="submitScore()">Submit for review</button>
        <div class="err" id="s-err"></div>
        <div class="ok" id="s-ok"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-fee">
      <div class="card">
        <label>Student</label>
        <input type="text" id="f-student-search" placeholder="Type to search student name…" oninput="filterStudents()" autocomplete="off">
        <div id="f-student-results" class="student-search-results"></div>
        <div id="f-student-selected" class="student-selected hidden">
          <strong id="f-student-selected-name"></strong>
          <button type="button" class="clear-student-btn" onclick="clearSelectedStudent()">✕</button>
        </div>

        <label>Term</label>
        <input type="text" id="f-term" placeholder="e.g. First Term 2026">

        <label>Amount paid (₦)</label>
        <input type="number" id="f-amount" min="0" placeholder="e.g. 50000">

        <label>Payment method</label>
        <select id="f-method">
          <option value="cash">Cash</option>
          <option value="bank_transfer">Bank Transfer</option>
          <option value="card">Card</option>
          <option value="cheque">Cheque</option>
        </select>

        <label>Note (optional)</label>
        <textarea id="f-note" placeholder="e.g. receipt number, partial payment note"></textarea>

        <button class="btn btn-primary" id="f-submit-btn" onclick="submitFeePayment()">Submit for review</button>
        <div class="err" id="f-err"></div>
        <div class="ok" id="f-ok"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-report">
      <div class="card" id="report-summary-card">
        <h2 style="font-size:16px;margin-bottom:8px;" id="report-title"></h2>
        <p class="muted" id="report-class-insights" style="margin-bottom:0;"></p>
      </div>

      <div id="report-students-list"></div>

      <div class="card">
        <p class="muted" style="margin-bottom:0;">Excluded students won't receive a message this week — everyone else will, the moment you approve.</p>
        <button class="btn btn-primary" id="approve-all-btn" onclick="approveAllReport()">✅ Approve All & Send</button>
        <div class="err" id="report-err"></div>
        <div class="ok" id="report-ok"></div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:15px">Recent submissions</h2>
      <div id="recent-list"></div>
    </div>
  </div>
</div>

<script>
const token = location.pathname.split('/').pop();
let portalData = null;

function getDeviceId() {
  let id = localStorage.getItem('eduping-device-id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('eduping-device-id', id);
  }
  return id;
}

async function api(path, opts = {}) {
  const res = await fetch(`/api/teacher/${token}${path}`, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'x-device-id': getDeviceId() },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

async function load() {
  try {
    portalData = await api('');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('header-sub').textContent = portalData.school_name || '';
    if (portalData.unlocked) {
      showMain();
    } else {
      document.getElementById('pin-view').classList.remove('hidden');
    }
  } catch (e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-text').textContent = e.message;
    document.getElementById('error-view').classList.remove('hidden');
  }
}

async function unlock() {
  const pin = document.getElementById('pin-input').value.trim();
  const errEl = document.getElementById('pin-err');
  errEl.style.display = 'none';
  if (pin.length !== 4) { errEl.textContent = 'Enter the 4-digit PIN.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('unlock-btn');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    await api('/unlock', { method: 'POST', body: { pin, device_id: getDeviceId() } });
    document.getElementById('pin-view').classList.add('hidden');
    portalData = await api('');
    showMain();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function showMain() {
  document.getElementById('main-view').classList.remove('hidden');
  document.getElementById('welcome-text').textContent = `Hi ${portalData.staff_name} 👋`;
  document.getElementById('welcome-sub').textContent = `${portalData.class_name || ''} ${portalData.subject ? '· ' + portalData.subject : ''}`;
  document.getElementById('s-subject').value = portalData.subject || '';

  const sel = document.getElementById('q-assessment');
  sel.innerHTML = portalData.assessments.length
    ? portalData.assessments.map(a => `<option value="${a.id}">${a.title} (${a.subject})</option>`).join('')
    : '<option value="">No open assessments for your class yet</option>';

  renderOptions();
  renderRecent();

  if (portalData.pending_weekly_report) {
    document.getElementById('tab-r-btn').classList.remove('hidden');
    loadWeeklyReport(portalData.pending_weekly_report.id);
  }

  if (portalData.is_accountant) {
    document.getElementById('tab-f-btn').classList.remove('hidden');
    document.getElementById('f-term').value = portalData.current_term || '';
    document.getElementById('welcome-sub').textContent = 'Accounts';
  }
}

function renderOptions() {
  const type = document.getElementById('q-type').value;
  const wrap = document.getElementById('q-options-wrap');
  if (type === 'fillin') { wrap.innerHTML = '<label>Correct answer</label><input type="text" id="fillin-answer" placeholder="Expected answer">'; return; }
  if (type === 'truefalse') {
    wrap.innerHTML = `
      <label>Correct answer</label>
      <div class="opt-row"><input type="radio" name="tf" value="true" checked><span>True</span></div>
      <div class="opt-row"><input type="radio" name="tf" value="false"><span>False</span></div>`;
    return;
  }
  wrap.innerHTML = `<label>Options (mark the correct one)</label><div id="mcq-opts"></div><button type="button" class="add-opt-btn" onclick="addOption()">+ Add option</button>`;
  addOption(); addOption();
}

function addOption() {
  const wrap = document.getElementById('mcq-opts');
  const row = document.createElement('div');
  row.className = 'opt-row';
  row.innerHTML = `<input type="radio" name="mcq-correct"><input type="text" placeholder="Option text">`;
  wrap.appendChild(row);
}

async function submitQuestion() {
  const errEl = document.getElementById('q-err'), okEl = document.getElementById('q-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  const assessment_id = document.getElementById('q-assessment').value;
  const question_text = document.getElementById('q-text').value.trim();
  const question_type = document.getElementById('q-type').value;
  const marks = parseInt(document.getElementById('q-marks').value, 10) || 1;

  if (!assessment_id) { errEl.textContent = 'Select an assessment.'; errEl.style.display = 'block'; return; }
  if (!question_text) { errEl.textContent = 'Enter the question text.'; errEl.style.display = 'block'; return; }

  let options = [];
  if (question_type === 'mcq') {
    const rows = document.querySelectorAll('#mcq-opts .opt-row');
    rows.forEach(r => {
      const radio = r.querySelector('input[type=radio]'); const text = r.querySelector('input[type=text]').value.trim();
      if (text) options.push({ text, is_correct: radio.checked });
    });
    if (options.length < 2) { errEl.textContent = 'Add at least 2 options.'; errEl.style.display = 'block'; return; }
    if (!options.some(o => o.is_correct)) { errEl.textContent = 'Mark the correct option.'; errEl.style.display = 'block'; return; }
  } else if (question_type === 'truefalse') {
    const val = document.querySelector('input[name=tf]:checked').value;
    options = [{ text: 'True', is_correct: val === 'true' }, { text: 'False', is_correct: val === 'false' }];
  } else {
    const ans = document.getElementById('fillin-answer').value.trim();
    if (!ans) { errEl.textContent = 'Enter the correct answer.'; errEl.style.display = 'block'; return; }
    options = [{ text: ans, is_correct: true }];
  }

  const btn = document.getElementById('q-submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await api('/questions', { method: 'POST', body: { assessment_id, question_text, question_type, marks, options } });
    okEl.textContent = r.message; okEl.style.display = 'block';
    document.getElementById('q-text').value = '';
    renderOptions();
    portalData = await api('');
    renderRecent();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
}

async function submitScore() {
  const errEl = document.getElementById('s-err'), okEl = document.getElementById('s-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  const student_name = document.getElementById('s-name').value.trim();
  const subject = document.getElementById('s-subject').value.trim();
  const score = document.getElementById('s-score').value;
  const term = document.getElementById('s-term').value.trim();

  if (!student_name || !subject || score === '') { errEl.textContent = 'Fill in student, subject, and score.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('s-submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await api('/scores', { method: 'POST', body: { student_name, subject, score: Number(score), term } });
    okEl.textContent = r.message; okEl.style.display = 'block';
    document.getElementById('s-name').value = ''; document.getElementById('s-score').value = '';
    portalData = await api('');
    renderRecent();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
}

function renderRecent() {
  const list = document.getElementById('recent-list');
  const items = portalData.recent_submissions || [];
  list.innerHTML = items.length
    ? items.map(i => `<div class="submission"><span>${i.kind === 'question' ? '❓' : i.kind === 'fee_payment' ? '💰' : '📊'} ${escapeHtml(i.label)}</span><span class="pill pill-${i.status}">${i.status}</span></div>`).join('')
    : '<p class="muted" style="font-size:13px">No submissions yet.</p>';
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Weekly Report review ─────────────────────────────────────
let weeklyReport = null;

async function loadWeeklyReport(reportId) {
  try {
    const r = await api(`/weekly-report/${reportId}`);
    weeklyReport = r;
    renderWeeklyReport();
  } catch (e) {
    document.getElementById('report-students-list').innerHTML = `<p class="err" style="display:block;">${escapeHtml(e.message)}</p>`;
  }
}

function renderWeeklyReport() {
  const data = weeklyReport.report_json;
  document.getElementById('report-title').textContent = `${weeklyReport.class_id} — Week ${weeklyReport.week_number} Report`;
  document.getElementById('report-class-insights').textContent = data.class_insights?.overall_performance || '';

  const list = document.getElementById('report-students-list');
  list.innerHTML = (data.students || []).map(s => `
    <div class="card student-report-card ${s.excluded ? 'excluded' : ''}" id="student-card-${s.student_id}">
      <div class="student-report-header">
        <span class="student-report-name">${escapeHtml(s.student_name)}</span>
        <label class="exclude-toggle">
          <input type="checkbox" ${s.excluded ? 'checked' : ''} onchange="toggleExclude('${s.student_id}', this.checked)">
          Exclude from this week's send
        </label>
      </div>
      <textarea class="report-textarea" id="report-text-${s.student_id}">${escapeHtml(s.parent_report || '')}</textarea>
      <button class="save-edit-btn" onclick="saveStudentEdit('${s.student_id}')">💾 Save edit</button>
      <div class="save-status" id="save-status-${s.student_id}">Saved ✓</div>
    </div>
  `).join('');

  if (weeklyReport.status !== 'generated') {
    document.getElementById('approve-all-btn').disabled = true;
    document.getElementById('approve-all-btn').textContent =
      weeklyReport.status === 'approved' ? '✅ Already approved & sent' : weeklyReport.status;
  }
}

function toggleExclude(studentId, excluded) {
  document.getElementById(`student-card-${studentId}`).classList.toggle('excluded', excluded);
  api(`/weekly-report/${weeklyReport.id}/student/${studentId}`, { method: 'POST', body: { excluded } })
    .catch(() => showSaveStatus(studentId, false));
}

async function saveStudentEdit(studentId) {
  const text = document.getElementById(`report-text-${studentId}`).value.trim();
  if (!text) return;
  try {
    await api(`/weekly-report/${weeklyReport.id}/student/${studentId}`, { method: 'POST', body: { parent_report: text } });
    showSaveStatus(studentId, true);
  } catch (e) {
    showSaveStatus(studentId, false);
  }
}

function showSaveStatus(studentId, ok) {
  const el = document.getElementById(`save-status-${studentId}`);
  if (!el) return;
  el.textContent = ok ? 'Saved ✓' : 'Could not save — try again';
  el.style.color = ok ? 'var(--success)' : 'var(--danger)';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

async function approveAllReport() {
  if (!confirm("Approve this week's report? Everyone not excluded will be messaged immediately.")) return;
  const btn = document.getElementById('approve-all-btn');
  const errEl = document.getElementById('report-err'), okEl = document.getElementById('report-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await api(`/weekly-report/${weeklyReport.id}/approve`, { method: 'POST' });
    okEl.textContent = r.message; okEl.style.display = 'block';
    btn.textContent = '✅ Sent';
    weeklyReport.status = 'approved';
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '✅ Approve All & Send';
  }
}

// ── Fee Payment (accountant/bursar) ──────────────────────────
let selectedFeeStudent = null;

function filterStudents() {
  const query = document.getElementById('f-student-search').value.trim().toLowerCase();
  const resultsEl = document.getElementById('f-student-results');
  if (!query) { resultsEl.classList.remove('show'); resultsEl.innerHTML = ''; return; }

  const matches = (portalData.all_students || [])
    .filter(s => s.name.toLowerCase().includes(query))
    .slice(0, 8);

  resultsEl.innerHTML = matches.length
    ? matches.map(s => `<div class="student-search-item" onclick='selectStudent(${JSON.stringify(s.id)}, ${JSON.stringify(s.name)}, ${JSON.stringify(s.class_name)})'>${escapeHtml(s.name)} <span style="color:var(--muted);">— ${escapeHtml(s.class_name||'')}</span></div>`).join('')
    : '<div class="student-search-item" style="color:var(--muted);">No match found</div>';
  resultsEl.classList.add('show');
}

function selectStudent(id, name, className) {
  selectedFeeStudent = id;
  document.getElementById('f-student-selected-name').textContent = `${name} — ${className || ''}`;
  document.getElementById('f-student-selected').classList.remove('hidden');
  document.getElementById('f-student-search').value = '';
  document.getElementById('f-student-results').classList.remove('show');
}

function clearSelectedStudent() {
  selectedFeeStudent = null;
  document.getElementById('f-student-selected').classList.add('hidden');
}

async function submitFeePayment() {
  const errEl = document.getElementById('f-err'), okEl = document.getElementById('f-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  const term = document.getElementById('f-term').value.trim();
  const amount_paid = document.getElementById('f-amount').value;
  const payment_method = document.getElementById('f-method').value;
  const note = document.getElementById('f-note').value.trim();

  if (!selectedFeeStudent) { errEl.textContent = 'Search and select a student first.'; errEl.style.display = 'block'; return; }
  if (!term) { errEl.textContent = 'Enter the term.'; errEl.style.display = 'block'; return; }
  if (!amount_paid || Number(amount_paid) <= 0) { errEl.textContent = 'Enter a valid amount.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('f-submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await api('/fee-payment', { method: 'POST', body: { student_id: selectedFeeStudent, term, amount_paid: Number(amount_paid), payment_method, note } });
    okEl.textContent = r.message; okEl.style.display = 'block';
    clearSelectedStudent();
    document.getElementById('f-amount').value = '';
    document.getElementById('f-note').value = '';
    portalData = await api('');
    renderRecent();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit for review';
  }
}

function switchTab(name) {
  document.getElementById('tab-question').classList.toggle('active', name === 'question');
  document.getElementById('tab-score').classList.toggle('active', name === 'score');
  document.getElementById('tab-report').classList.toggle('active', name === 'report');
  document.getElementById('tab-fee').classList.toggle('active', name === 'fee');
  document.getElementById('tab-q-btn').classList.toggle('active', name === 'question');
  document.getElementById('tab-s-btn').classList.toggle('active', name === 'score');
  document.getElementById('tab-r-btn').classList.toggle('active', name === 'report');
  document.getElementById('tab-f-btn').classList.toggle('active', name === 'fee');
}

load();
</script>
